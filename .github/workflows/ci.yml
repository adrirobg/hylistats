name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hylistats
          POSTGRES_PASSWORD: hylistats
          POSTGRES_DB: hylistats_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hylistats -d hylistats_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://hylistats:hylistats@localhost:5433/hylistats_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
