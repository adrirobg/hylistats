# Postgres local para desarrollo (BD `hylistats`) y tests (BD `hylistats_test`).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hylistats
      POSTGRES_PASSWORD: hylistats
      POSTGRES_DB: hylistats
    ports:
      - "5433:5432"
    volumes:
      - hylistats_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hylistats -d hylistats"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hylistats_pgdata:
